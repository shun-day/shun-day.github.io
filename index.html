<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffefa">
  <meta name="description" content="새하얀 종이 위 크레파스 그림으로 펼쳐지는 우리의 결혼 이야기.">
  <title>Our Happily Ever After | 모바일 청첩장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
  <script src="storybook-art.js" defer></script>
</head>
<body> 
  <div class="site-shell">
    <header class="topbar">
      <button class="wordmark" type="button" data-go="cover" aria-label="청첩장 표지로 이동">
        <span class="wordmark-symbol" aria-hidden="true">✿</span>
        <span>Happily Ever After</span>
      </button>
      <button class="easy-view-trigger" type="button" data-go="contents"><span aria-hidden="true">⌂</span> 예식 안내</button>
    </header>

    <main class="main-area" id="mainArea">
      <div class="book-window" id="bookWindow">
        <div class="book" id="book" data-closed="true" aria-label="책장 넘기는 모바일 청첩장">
          <div class="book-board board-left" aria-hidden="true"></div>
          <div class="book-board board-right" aria-hidden="true"></div>
          <div class="book-spine" aria-hidden="true"></div>
          <div class="paper-page left-page" id="leftPage" aria-hidden="true"></div>
          <div class="paper-page right-page" id="rightPage"></div>
          <div class="flip-sheet" id="flipSheet" aria-hidden="true">
            <div class="sheet-face sheet-front" id="sheetFront"></div>
            <div class="sheet-face sheet-back" id="sheetBack"></div>
          </div>
          <div class="hard-cover" id="hardCover" aria-hidden="false">
            <div class="hard-face hard-front" id="coverFront"></div>
            <div class="hard-face hard-inside" id="coverInside" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="청첩장 페이지 이동">
      <button type="button" class="nav-btn" id="prevBtn">← <span>이전 장</span></button>
      <button type="button" class="nav-btn nav-toc" id="tocBtn" data-go="contents">⌂ <span>첫 페이지</span></button>
      <button type="button" class="nav-btn nav-next" id="nextBtn"><span>다음 장</span> →</button>
    </nav>
    <p class="page-status" id="pageStatus" aria-live="polite">표지 · 0 / 6</p>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="웨딩 사진 크게 보기">
    <div class="lightbox-bar"><span id="lightboxCounter">1 / 20</span><button type="button" class="lightbox-close" id="lightboxClose" aria-label="사진 닫기">✕ 닫기</button></div>
    <div class="lightbox-body"><button type="button" class="lightbox-arrow" id="lightboxPrev" aria-label="이전 사진">‹</button><img id="lightboxImage" alt=""><button type="button" class="lightbox-arrow" id="lightboxNext" aria-label="다음 사진">›</button></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
